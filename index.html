<!DOCTYPE html>
<html>
    <head>
        <a href="library.html?type=movie">Your Movies</a>
        <a href="library.html?type=show">Your Shows</a>
        <a href="library.html?type=game">Your Games</a>
        <a href="library.html?type=anime">Your Anime</a>
        <a href="library.html?type=manga">Your Manga</a>

        <h1>Media Tracker</h1>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h2>Track Movies, Shows, Games, Anime, and Manga</h2>
        <p>
            This site retrieves data from the TMDB, IGDB, and AniList APIs
        </p>

        <div class="topnav">
            <form id="searchForm">
                <input id="input" type="text" placeholder="Search.." required />

                <br><br>

                <label for="media_type">Media Type:</label>
                <select id="type" name="media_type">
                    <option value="movie">Movie</option>
                    <option value="show">TV Show</option>
                    <option value="game">Game</option>
                    <option value="anime">Anime</option>
                    <option value="manga">Manga</option>
                </select>

                <br><br>
            </form>
        </div>

        <div id="results" class="container">
            <dialog id="confirmation">
                <h1>Would you like to save your selection?</h1>
                <div class="button-group">
                    <button id="confirm">Yes</button>
                    <button id="deny">No</button>
                </div>
            </dialog>
        </div>

        <script type="module" src="index.js"></script>
    </body>

</html>
