<!DOCTYPE html>
<html>
    <head>
        <title>Media Tracker</title>

        <link rel="stylesheet" href="media_tracker.css">
    </head>

    <body>
        <h1>
            Track Movies, Shows, Games, Anime, and Manga
        </h1>
        <p>
            This site retrieves data from the TMDB, IGDB, and AniList APIs
        </p>

        <div class="topnav">
            <form id="searchForm">
                <input id="input" type="text" placeholder="Search.." required />

                <br><br>

                <label for="media_type">Media Type:</label>
                <select id="type" name="media_type">
                    <option value="movie">Movie</option>
                    <option value="show">TV Show</option>
                    <option value="game">Game</option>
                    <option value="anime">Anime</option>
                    <option value="manga">Manga</option>
                </select>

                <br><br>
            </form>
        </div>

        <script src="media_tracker.js"></script>

        <div id="results" class="container">
            
        </div>
    </body>

</html>
